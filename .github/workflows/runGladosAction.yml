name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 6点30分(北京 14:30)提前启动，对冲 GitHub schedule 常见的 1-5 小时调度延迟；
    # job 内动态睡到北京 20:30-22:00(UTC 12:30-14:00)内的随机时刻再签到
    - cron: 30 6 * * *
  # 标星时触发工作流程
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    # cron 提前 6 小时启动 + 最长等待约 7.5 小时，默认 360 分钟超时不够用
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: 3.9
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Wait until random moment in 20:30-22:00 Beijing (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          WIN_START=$(date -u -d "${TODAY} 12:30:00" +%s)
          WIN_END=$(date -u -d "${TODAY} 14:00:00" +%s)
          TARGET=$((WIN_START + RANDOM % (WIN_END - WIN_START)))
          NOW=$(date -u +%s)
          echo "Target checkin time: $(date -u -d @${TARGET} '+%H:%M:%S') UTC"
          if [ "$NOW" -lt "$TARGET" ]; then
            DELAY=$((TARGET - NOW))
            echo "Sleeping ${DELAY}s ($((DELAY/60)) min) before checkin..."
            sleep "$DELAY"
          else
            echo "Already past today's target window - checking in immediately."
          fi
      - name: Run checkin
        run: |
          python3 glados.py
        env:
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
